# Builds the site on every push so a Cloudflare Pages deploy (or anything else) can pick up dist/.
# Cloudflare Pages can also build this repo itself — then this workflow is optional and only here
# to catch build errors early. It publishes dist/ as an artifact, nothing else.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Which desktop apps to show (see .env.example). Unset repository variables fall back to the defaults.
        env:
          VITE_SHOW_ABOUT: ${{ vars.VITE_SHOW_ABOUT }}
          VITE_SHOW_PROJECTS: ${{ vars.VITE_SHOW_PROJECTS }}
          VITE_SHOW_EXPERIENCE: ${{ vars.VITE_SHOW_EXPERIENCE }}
          VITE_SHOW_STACK: ${{ vars.VITE_SHOW_STACK }}
          VITE_SHOW_NOTES: ${{ vars.VITE_SHOW_NOTES }}
          VITE_SHOW_SPOTIFY: ${{ vars.VITE_SHOW_SPOTIFY }}
          VITE_SHOW_TERMINAL: ${{ vars.VITE_SHOW_TERMINAL }}
          VITE_SHOW_CONTACT: ${{ vars.VITE_SHOW_CONTACT }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
