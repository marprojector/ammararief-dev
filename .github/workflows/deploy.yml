name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Which desktop apps to show (see .env.example). Unset repository variables fall back to the defaults.
        env:
          VITE_SHOW_ABOUT: ${{ vars.VITE_SHOW_ABOUT }}
          VITE_SHOW_PROJECTS: ${{ vars.VITE_SHOW_PROJECTS }}
          VITE_SHOW_EXPERIENCE: ${{ vars.VITE_SHOW_EXPERIENCE }}
          VITE_SHOW_STACK: ${{ vars.VITE_SHOW_STACK }}
          VITE_SHOW_NOTES: ${{ vars.VITE_SHOW_NOTES }}
          VITE_SHOW_SPOTIFY: ${{ vars.VITE_SHOW_SPOTIFY }}
          VITE_SHOW_TERMINAL: ${{ vars.VITE_SHOW_TERMINAL }}
          VITE_SHOW_CONTACT: ${{ vars.VITE_SHOW_CONTACT }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
